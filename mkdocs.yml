site_name: Signboard
site_description: Open-source job management for sign and print shops.
site_url: https://signboard.works/
repo_url: https://github.com/signboard-works/signboard
repo_name: signboard-works/signboard
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  templates/

nav:
  - Home: index.md
  - Product:
      - Vision: product/vision.md
      - Open questions: product/open-questions.md
      - Quotes: product/prd-quotes.md
      - Sales orders: product/prd-sales-orders.md
      - Jobs and kanban: product/prd-jobs-kanban.md
      - Invoices: product/prd-invoices.md
      - Customer email: product/prd-customer-email.md
      - Migration: product/prd-migration.md
  - Design:
      - Architecture: design/architecture.md
      - Front end: design/front-end.md
      - Data model: design/data-model.md
      - Pricing engine: design/pricing-engine.md
      - Accounting integration: design/accounting-integration.md
      - Email delivery: design/email-delivery.md
      - Deployment: design/deployment.md
  - Decisions:
      - adr/index.md
      - "0001 Record architecture decisions": adr/0001-record-architecture-decisions.md
      - "0002 Docs as code": adr/0002-docs-as-code.md
      - "0003 Licence": adr/0003-licence.md
      - "0004 Multi-tenant SaaS": adr/0004-multi-tenant.md
      - "0005 Accounting as a plugin": adr/0005-accounting-as-plugin.md
      - "0006 Configuration over customisation": adr/0006-configuration-over-customisation.md
      - "0007 Back end: .NET": adr/0007-backend-dotnet.md
      - "0008 Database: PostgreSQL": adr/0008-database-postgresql.md
      - "0009 Front end: React": adr/0009-frontend-react.md
      - "0010 API first": adr/0010-api-first.md
      - "0011 Documentation first": adr/0011-documentation-first.md
      - "0012 Testing strategy": adr/0012-testing.md
      - "0013 Work in the open": adr/0013-work-in-the-open.md
      - "0014 Build journal": adr/0014-build-journal.md
      - "0015 Separate deployments, one origin": adr/0015-separate-deployments-one-origin.md
      - "0016 RQL queries": adr/0016-rql-queries.md
      - "0017 Object IDs": adr/0017-object-ids.md
      - "0018 Soft deletion": adr/0018-soft-delete.md
      - "0019 Audit trail": adr/0019-audit-trail.md
      - "0020 URL structure": adr/0020-url-structure.md
      - "0021 Authentication": adr/0021-authentication.md
      - "0022 Authorisation and roles": adr/0022-authorisation-and-roles.md
      - "0023 Email sending": adr/0023-email-sending.md
      - "0024 Product analytics": adr/0024-product-analytics.md
      - "0025 Observability": adr/0025-observability.md
  - Build journal:
      - journal/index.md
      - "2026-10-10": journal/2026-10-10.md
  - Glossary: glossary.md
